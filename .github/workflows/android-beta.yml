name: Android - private Firebase beta
on:
  workflow_dispatch:
  push:
    branches: [beta, codex/private-beta]
permissions:
  contents: read
concurrency:
  group: android-beta
  cancel-in-progress: false
jobs:
  distribute:
    # Opt in only after configuring the private tester group and credentials.
    if: vars.ANDROID_BETA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-beta
    env:
      BETVERSE_BETA_ORIGIN: ${{ vars.BETVERSE_BETA_ORIGIN }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_TESTER_GROUP: betverse-private
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy default "tools" package has been removed from the SDK repository.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Check configuration
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
          BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node --input-type=module <<'JS'
          import { validateBetaOrigin } from './scripts/prepare-android.mjs';
          validateBetaOrigin(process.env.BETVERSE_BETA_ORIGIN);
          for (const key of ['BETA_KEYSTORE_BASE64', 'BETA_KEYSTORE_PASSWORD', 'FIREBASE_CREDENTIALS', 'FIREBASE_APP_ID']) {
            if (!process.env[key]) throw new Error(`${key} manque : voir docs/ANDROID_FIREBASE.md`);
          }
          const response = await fetch(`${process.env.BETVERSE_BETA_ORIGIN}/api/health`, {
            redirect: 'error', signal: AbortSignal.timeout(15000),
          });
          if (!response.ok || (await response.json()).status !== 'ok') {
            throw new Error('Le backend de test ne répond pas sur /api/health.');
          }
          JS
      - run: npm ci --ignore-scripts
      - run: npm --prefix server ci --ignore-scripts
      - run: npm run test:api
      - run: npm run test:web
      - run: npm run android:prepare
      - name: Restore beta signing key
        env:
          KEY_BASE64: ${{ secrets.BETA_KEYSTORE_BASE64 }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync(`${process.env.RUNNER_TEMP}/betverse-beta.p12`, Buffer.from(process.env.KEY_BASE64, 'base64'), { mode: 0o600 });
          JS
      - name: Build signed APK
        working-directory: android
        env:
          BETA_KEYSTORE_PATH: ${{ runner.temp }}/betverse-beta.p12
          BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
          BETVERSE_ANDROID_VERSION_CODE: ${{ github.run_number }}
          BETVERSE_ANDROID_VERSION_NAME: 1.0.0-beta.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
      - name: Keep APK for manual download
        # Public-repository artifacts can be downloaded outside our Firebase tester group.
        if: github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: betverse-beta-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
      - name: Authenticate Firebase
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - name: Distribute to the private tester group
        run: |
          npx --yes firebase-tools@15.34.2 appdistribution:distribute \
            android/app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" --groups "$FIREBASE_TESTER_GROUP" \
            --release-notes "BetVerse beta ${GITHUB_RUN_NUMBER} - ${GITHUB_SHA}" --non-interactive
      - name: Remove runner signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/betverse-beta.p12"
