<section class="auth-card">
  <p class="auth-card__eyebrow">BetVerse Access</p>
  <h1>Mot de passe oublié</h1>
  <p>Indique ton email ou pseudo pour recevoir un lien de réinitialisation.</p>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email ou pseudo
      <input type="text" formControlName="identifier" placeholder="john@betverse.gg ou neonverse" />
      <span class="field-error" *ngIf="form.get('identifier')?.touched && form.get('identifier')?.invalid">
        Identifiant requis (3 caractères min)
      </span>
    </label>

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Envoi...' : 'Envoyer le lien' }}
    </button>
  </form>

  <p class="form-success" *ngIf="successMessage()">
    {{ successMessage() }}
  </p>
  <p class="form-error" *ngIf="errorMessage()">
    {{ errorMessage() }}
  </p>

  <p class="form-footer">
    <a routerLink="/auth/login">Retour à la connexion</a>
  </p>
</section>
