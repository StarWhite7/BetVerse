<section class="auth-card">
  <p class="auth-card__eyebrow">BetVerse Access</p>
  <h1>Réinitialiser le mot de passe</h1>
  <p>Saisis ton nouveau mot de passe ci-dessous.</p>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Nouveau mot de passe
      <input type="password" formControlName="password" placeholder="********" />
      <span class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        6 caractères minimum
      </span>
    </label>

    <label>
      Confirmer le mot de passe
      <input type="password" formControlName="confirmPassword" placeholder="********" />
      <span class="field-error" *ngIf="form.get('confirmPassword')?.touched && form.get('confirmPassword')?.invalid">
        Confirmation requise
      </span>
      <span class="field-error" *ngIf="mismatch()">
        Les mots de passe ne correspondent pas.
      </span>
    </label>

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Mise à jour...' : 'Mettre à jour' }}
    </button>
  </form>

  <p class="form-success" *ngIf="successMessage()">
    {{ successMessage() }}
  </p>
  <p class="form-error" *ngIf="errorMessage()">
    {{ errorMessage() }}
  </p>

  <p class="form-footer">
    <a routerLink="/auth/login">Retour à la connexion</a>
  </p>
</section>
