<section class="auth-card">
  <p class="auth-card__eyebrow">BetVerse Access</p>
  <h1>Connexion</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <label>
      Email ou pseudo
      <input type="text" formControlName="identifier" placeholder="john@betverse.gg ou neonverse" />
      <span class="field-error" *ngIf="form.get('identifier')?.touched && form.get('identifier')?.invalid">
        Identifiant requis (3 caractères min)
      </span>
    </label>

    <label>
      Mot de passe
      <input type="password" formControlName="password" placeholder="********" />
      <span class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
        6 caractères minimum
      </span>
    </label>

    <a routerLink="/auth/forgot-password" class="form-link">Mot de passe oublié ?</a>

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>

  <p class="form-error" *ngIf="error()">
    {{ error() }}
  </p>

  <p class="form-footer">
    Pas encore de compte ?
    <a routerLink="/auth/signup">Créer un compte</a>
  </p>
  <div class="auth-social">
    <a
      class="auth-social__link"
      href="https://discord.com/invite/vduD4rZAKu"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Rejoindre le Discord BetVerse"
    >
      <svg viewBox="0 0 256 199" role="img" aria-hidden="true" focusable="false">
        <path
          d="M216.856 16.596A208.502 208.502 0 0 0 164.041 0c-2.275 4.113-4.863 9.76-6.66 14.146a193.708 193.708 0 0 0-58.76 0c-1.797-4.386-4.408-10.033-6.673-14.146a207.992 207.992 0 0 0-52.81 16.596C7.246 67.64-3.678 118.477 1.842 168.09c23.274 17.238 45.708 27.72 67.653 34.19 5.51-7.517 10.4-15.51 14.63-23.87-8.01-3.03-15.678-6.79-22.9-11.26 1.92-1.43 3.8-2.92 5.6-4.45 44.09 20.62 92.08 20.62 135.67 0 1.82 1.52 3.7 3.02 5.6 4.45-7.24 4.48-14.92 8.24-22.94 11.27 4.24 8.35 9.13 16.34 14.64 23.86 21.95-6.47 44.4-16.95 67.68-34.2 6.47-56.02-11.06-106.42-38.06-151.49ZM85.47 135.35c-13.11 0-23.87-12.05-23.87-26.86 0-14.82 10.63-26.87 23.87-26.87 13.25 0 24.01 12.05 23.87 26.87 0 14.81-10.62 26.86-23.87 26.86Zm85.05 0c-13.11 0-23.87-12.05-23.87-26.86 0-14.82 10.63-26.87 23.87-26.87 13.25 0 24.01 12.05 23.87 26.87 0 14.81-10.62 26.86-23.87 26.86Z"
        />
      </svg>
    </a>
    <a
      class="auth-social__link"
      href="https://x.com/BetVerse_Off"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Suivre BetVerse sur X"
    >
      <svg viewBox="0 0 1200 1227" role="img" aria-hidden="true" focusable="false">
        <path
          d="M714.163 519.284 1160.89 0H1055.03L666.97 450.887 357.328 0H0L468.492 681.821 0 1226.37H105.866L515.07 750.058 842.672 1226.37H1200L714.137 519.284h.026ZM569.165 687.828 521.585 619.934 158.94 79.694h162.604l292.52 418.428 47.58 67.894 380.66 544.3H878.72L569.165 687.854v-.026Z"
        />
      </svg>

  </div>
</section>
